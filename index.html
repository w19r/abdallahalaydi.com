<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <!-- ==========================================
       1. الإعدادات الأساسية ومحركات البحث (SEO)
       ========================================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdallah Alaydi — Computer Systems Engineering</title>
  <meta name="description" content="A personal home for everything I make, each in its own world. I build quiet, lasting things for the web." />
  <meta name="author" content="Abdallah Alaydi" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://abdallahalaydi.com/" />

  <!-- ==========================================
       2. أيقونات المتصفحات والهواتف (Favicons & PWA)
       ========================================== -->
  <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />

  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Abdallah" />

  <!-- ==========================================
       3. وسوم المشاركة (Open Graph)
       ========================================== -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:site_name" content="Abdallah Alaydi" />
  <meta property="og:url" content="https://abdallahalaydi.com/" />
  <meta property="og:title" content="Abdallah Alaydi — I build quiet, lasting things for the web." />
  <meta property="og:description" content="A personal home for everything I make, each in its own world. Computer Systems Engineering student." />
  <meta property="og:image" content="https://abdallahalaydi.com/assets/images/og-cover.png" />
  <meta property="og:image:secure_url" content="https://abdallahalaydi.com/assets/images/og-cover.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Abdallah Alaydi Personal Website" />

  <!-- ==========================================
       4. وسوم المشاركة لمنصة إكس (Twitter / X Cards)
       ========================================== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://abdallahalaydi.com/" />
  <meta name="twitter:title" content="Abdallah Alaydi — I build quiet, lasting things for the web." />
  <meta name="twitter:description" content="A personal home for everything I make, each in its own world. Computer Systems Engineering student." />
  <meta name="twitter:image" content="https://abdallahalaydi.com/assets/images/og-cover.png" />
  <meta name="twitter:image:alt" content="Abdallah Alaydi Personal Website" />

  <!-- ==========================================
       5. الخطوط: Inter و JetBrains Mono
       ========================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />

  <!-- ==========================================
       6. ملفات التنسيق المقسمة (Modular CSS)
       ========================================== -->
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/skeleton.css" />

  <!-- ==========================================
       7. بيانات مهيكلة (JSON-LD)
       ========================================== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Abdallah Alaydi",
    "url": "https://abdallahalaydi.com",
    "jobTitle": "Computer Systems Engineering Student",
    "description": "A personal home for everything I make, each in its own world.",
    "sameAs": [
      "https://github.com/w19r"
    ]
  }
  </script>
</head>
<body>

  <main class="container">
    <!-- الشريط العلوي -->
    <header class="header cascade-item" style="--step: 1;">
      <span class="brand" id="brand-logo" style="cursor: pointer;" title="Switch mode">abdallah.</span>
      
      <div class="header-controls">
        <!-- كبسولة التبديل بين البرمجة والحياة -->
        <div class="mode-switch" role="tablist">
          <button id="btn-craft" class="mode-btn active">Craft</button>
          <button id="btn-vibe" class="mode-btn">Vibe</button>
        </div>

        <!-- زر تغيير الثيم (أبيض/أسود) -->
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
          <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- قسم النبذة التعريفية (Hero) -->
    <section class="intro cascade-item" style="--step: 2;">
      <div class="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Open to new projects</span>
      </div>
      
      <h1 id="hero-title" class="hero-title" style="cursor: pointer;" title="Click to switch vibe">
        I build quiet, lasting things for the web.
      </h1>
      
      <p id="hero-bio" class="intro-paragraph">
        Computer Systems Engineering student. Building simple, fast, and clean web projects.
      </p>
    </section>

    <!-- ========================================== -->
    <!-- 1. واجهة الـ CRAFT (تظهر افتراضياً) -->
    <!-- ========================================== -->
    <div id="craft-view" class="view-section active-view">
      
      <!-- قسم المشاريع -->
      <section class="section cascade-item" style="--step: 3;">
        <h2 class="section-label">PROJECTS</h2>
        <div id="projects-list" class="item-list">
          <div class="skeleton-row">
            <div class="skeleton-line title"></div>
            <div class="skeleton-line sub"></div>
          </div>
        </div>
      </section>

      <!-- قسم الوقت الحالي (Now) -->
      <section class="section cascade-item" style="--step: 4;">
        <h2 class="section-label" id="now-label">NOW</h2>
        <p id="now-text" class="muted-paragraph">
          <span class="skeleton-line full"></span>
        </p>
      </section>
      
    </div>

    <!-- ========================================== -->
    <!-- 2. واجهة الـ VIBE (تظهر عند الضغط على Vibe) -->
    <!-- ========================================== -->
    <div id="vibe-view" class="view-section">
      <!-- قسم Letterboxd  -->
      <section class="section cascade-item" style="--step: 3;">
        <div class="lb-theme-card">
          <div class="lb-topbar">
            <div class="lb-section-title">
              <div class="lb-dots">
                <span class="dot-orange"></span>
                <span class="dot-green"></span>
                <span class="dot-blue"></span>
              </div>
              <span>RECENTLY WATCHED</span>
            </div>
            <a href="https://letterboxd.com/w19r/" target="_blank" rel="noopener" class="lb-all-link">
              @w19r ↗
            </a>
          </div>

          <!-- شبكة البوسترات -->
          <div id="lb-grid" class="lb-poster-grid">
            <div class="lb-skeleton"></div>
            <div class="lb-skeleton"></div>
            <div class="lb-skeleton"></div>
            <div class="lb-skeleton"></div>
          </div>
          
          <!-- المراجعة النصية -->
          <div id="lb-review-banner" class="lb-review-pill" style="display: none;"></div>
        </div>
      </section>
    </div>

    <!-- التذييل السفلي -->
    <footer class="footer cascade-item" style="--step: 5;">
      <div class="footer-links">
        <a href="https://github.com/w19r" target="_blank" rel="noopener">github</a>
        <button id="copy-email" class="link-btn" data-email="me@abdallahalaydi.com">email</button>
      </div>
      <span class="copyright">© 2026 Abdallah Alaydi</span>
    </footer>
  </main>

  <!-- النافذة المنزلقة لتفاصيل المشروع -->
  <div id="project-drawer" class="drawer-backdrop" aria-hidden="true">
    <div class="drawer-panel" role="dialog" aria-modal="true">
      
      <div id="drawer-image-wrapper" class="drawer-image-wrapper" style="display: none;">
        <img id="drawer-image" src="" alt="Project Preview" loading="eager">
      </div>

      <div class="drawer-header">
        <span id="drawer-date" class="mono-meta"></span>
        <button id="drawer-close" class="close-btn" aria-label="Close details">✕</button>
      </div>

      <h3 id="drawer-title" class="drawer-title"></h3>
      <p id="drawer-description" class="drawer-desc"></p>
      <div id="drawer-tags" class="tag-row"></div>
      <div class="drawer-actions">
        <a id="drawer-live" href="#" target="_blank" rel="noopener" class="lux-btn primary">Visit Site ↗</a>
        <a id="drawer-repo" href="#" target="_blank" rel="noopener" class="lux-btn secondary">Source Code</a>
      </div>

    </div>
  </div>

  <!-- إشعار نسخ الإيميل -->
  <div id="toast" class="toast">Email copied to clipboard</div>

  <script src="scripts/render.js?v=2"></script>
  <script src="scripts/app.js?v=2"></script>
</body>

</html>
