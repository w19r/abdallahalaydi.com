<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- خلفية فاتحة نظيفة مثل صورة براين (يمكنك قلبها لـ #0A0A0A) -->
  <rect width="1200" height="630" fill="#FAFAFA" />
  
  <!-- خطوط قياس هندسية خفيفة -->
  <line x1="0" y1="385" x2="1200" y2="385" stroke="#0A0A0A" stroke-opacity="0.06" stroke-width="1.5" />
  <line x1="490" y1="0" x2="490" y2="630" stroke="#0A0A0A" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="692" y1="0" x2="692" y2="630" stroke="#0A0A0A" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- إطار خفيف حول منطقة الشعار -->
  <rect x="440" y="190" width="310" height="250" rx="24" fill="none" stroke="#0A0A0A" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- الشعار -->
  <text x="565" y="385" 
        font-family="Inter, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="220" 
        fill="#0A0A0A" 
        text-anchor="middle" 
        letter-spacing="-8">a</text>
  <circle cx="670" cy="360" r="22" fill="#FF4F00" />
</svg>
