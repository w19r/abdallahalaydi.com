<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0A0A0A" />
  
  <!-- شبكة نقاط خلفية في المركز فقط -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1.5" fill="#FFFFFF" fill-opacity="0.12" />
  </pattern>
  <circle cx="600" cy="315" r="220" fill="url(#dots)" />

  <!-- دائرة مركزية صلبة تحمل الشعار -->
  <circle cx="600" cy="315" r="110" fill="#121212" stroke="#262626" stroke-width="2" />

  <!-- الشعار بحجم ملموم وهادئ -->
  <text x="580" y="365" 
        font-family="Inter, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="150" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="-6">a</text>
  <circle cx="652" cy="348" r="15" fill="#FFFFFF" />
</svg>
