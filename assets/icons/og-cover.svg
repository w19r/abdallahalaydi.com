<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- تدرج يجعل الحرف يذوب في الخلفية من الأسفل -->
    <linearGradient id="fade-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0A" />

  <!-- حرف a يتلاشى في الظلام -->
  <text x="555" y="410" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-weight="800" 
        font-size="310" 
        fill="url(#fade-text)" 
        text-anchor="middle" 
        letter-spacing="-12">a</text>
        
  <!-- النقطة ساطعة وحادة لكسر التلاشي -->
  <circle cx="700" cy="375" r="28" fill="#FFFFFF" />
</svg>
