<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- خلفية بيضاء هادئة -->
  <rect width="1200" height="630" fill="#FAFAFA" />
  
  <!-- شبكة النقاط المركزية -->
  <defs>
    <pattern id="mono-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2" fill="#0A0A0A" fill-opacity="0.15" />
    </pattern>
  </defs>
  
  <!-- هالة النقاط المتدرجة -->
  <circle cx="600" cy="315" r="220" fill="url(#mono-dots)" />
  <circle cx="600" cy="315" r="160" fill="none" stroke="#0A0A0A" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- نواة الشعار البيضاء -->
  <circle cx="600" cy="315" r="95" fill="#FAFAFA" stroke="#0A0A0A" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- الشعار بالأسود النقي -->
  <text x="582" y="362" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-weight="700" 
        font-size="140" 
        fill="#0A0A0A" 
        text-anchor="middle" 
        letter-spacing="-6">a</text>
  <circle cx="648" cy="346" r="14" fill="#0A0A0A" />
</svg>
