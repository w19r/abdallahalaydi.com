<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- خلفية سوداء عميقة -->
  <rect width="1200" height="630" fill="#0A0A0A" />
  
  <!-- تقاطع محاور خفيف جداً في الخلفية -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
  <line x1="600" y1="0" x2="600" y2="630" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- دوائر مدارية متلاشية حول المركز -->
  <circle cx="600" cy="315" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />
  <circle cx="600" cy="315" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="600" cy="315" r="280" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1.5" />

  <!-- الشعار بالأبيض الصريح -->
  <text x="576" y="368" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-weight="700" 
        font-size="160" 
        fill="#FAFAFA" 
        text-anchor="middle" 
        letter-spacing="-7">a</text>
  <circle cx="652" cy="350" r="16" fill="#FAFAFA" />
</svg>
