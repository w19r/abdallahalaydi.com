<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- الخلفية والشبكة الهندسية -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A1A1A" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- مؤشر الحالة (Status Pill) -->
  <g transform="translate(100, 180)">
    <rect width="250" height="44" rx="22" fill="#141414" stroke="#222222" stroke-width="1"/>
    <circle cx="28" cy="22" r="6" fill="#00FF66"/>
    <text x="50" y="27" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#888888">Open to new projects</text>
  </g>

  <!-- النصوص الأساسية -->
  <g transform="translate(100, 320)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="84" font-weight="600" fill="#FAFAFA" letter-spacing="-3px">abdallah.</text>
    <text x="0" y="65" font-family="Inter, sans-serif" font-size="32" font-weight="400" fill="#888888">Computer Systems Engineering</text>
    <text x="0" y="115" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#555555">I build quiet, lasting things for the web.</text>
  </g>

  <!-- رابط الموقع السفلي -->
  <g transform="translate(100, 540)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="22" fill="#444444">abdallahalaydi.com</text>
  </g>
</svg>
